<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ground" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2334"/>
      <stop offset="1" stop-color="#16121C"/>
    </linearGradient>
  </defs>
  <!-- Aubergine ground -->
  <rect width="512" height="512" rx="120" fill="url(#ground)"/>
  <rect x="3" y="3" width="506" height="506" rx="117" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6"/>
  <!-- Speech, one bar per mode pigment -->
  <rect x="80" y="200" width="44" height="112" rx="22" fill="#B8A4FF"/>
  <rect x="144" y="148" width="44" height="216" rx="22" fill="#FFB088"/>
  <rect x="208" y="100" width="44" height="312" rx="22" fill="#86C8FF"/>
  <rect x="272" y="168" width="44" height="176" rx="22" fill="#EED36F"/>
  <!-- ...arriving at the text cursor -->
  <rect x="380" y="100" width="24" height="312" rx="12" fill="#F2EDF5"/>
  <rect x="352" y="100" width="80" height="24" rx="12" fill="#F2EDF5"/>
  <rect x="352" y="388" width="80" height="24" rx="12" fill="#F2EDF5"/>
</svg>
